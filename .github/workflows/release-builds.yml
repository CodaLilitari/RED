name: Model Studio native Linux evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-uv:
    name: Native UV evidence for efbd34a
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: efbd34ad541ec403c3623a36cbee26d3393ec4b2
          persist-credentials: false

      - name: Record exact source
        run: |
          test "$(git rev-parse HEAD)" = efbd34ad541ec403c3623a36cbee26d3393ec4b2
          mkdir evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/source-tree.txt

      - name: Install isolated X11 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libpulse0 xvfb xauth openbox x11-utils libgl1-mesa-dri

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          aqtversion: ==3.3.0
          py7zrversion: ==1.1.0

      - name: Configure and build the Studio test target
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSED_CPP_STANDARD=23 \
            -DSED_QT_ROOT="$QT_ROOT_DIR" -DSED_BUILD_UPDATE=OFF -DSED_BUILD_PLUGIN_BRIDGE=OFF
          cmake --build build --target sed_model_studio_dialog_tests --parallel 4

      - name: Native Studio interaction and UV captures at both scales
        timeout-minutes: 10
        run: |
          xvfb-run -a -s '-screen 0 3840x2160x24 -nolisten tcp' bash -euo pipefail -c '
            openbox > evidence/openbox.log 2>&1 &
            manager_pid=$!
            trap "kill $manager_pid 2>/dev/null || true" EXIT
            ready=false
            for attempt in {1..100}; do
              kill -0 "$manager_pid"
              state=$(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null) || state=""
              if [[ "$state" == *"window id #"* ]]; then ready=true; break; fi
              sleep 0.1
            done
            test "$ready" = true
            xdpyinfo > evidence/display.txt
            export XDG_CONFIG_HOME="$RUNNER_TEMP/uv-config"
            export XDG_CACHE_HOME="$RUNNER_TEMP/uv-cache"
            export XDG_DATA_HOME="$RUNNER_TEMP/uv-data"
            timeout 120s env QT_SCALE_FACTOR=2 SED_TEST_EXPECTED_DPR=2 \
              build/src/app/sed_model_studio_dialog_tests 2>&1 | tee evidence/studio-native-200.log
            for scale in 1 2; do
              timeout 120s env QT_SCALE_FACTOR="$scale" SED_TEST_EXPECTED_DPR="$scale" \
                build/src/app/sed_model_studio_dialog_tests --evidence-directory "$PWD/evidence/scale-$scale" \
                2>&1 | tee "evidence/uv-scale-$scale.log"
            done
          '

      - name: Verify native-published UV identities
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = "c9b82cac866aa6327f212c162ade6fa1d333a10506e3c0a0d80688fe66ceac06"
          records = []
          for scale in (1, 2):
              folder = Path("evidence") / f"scale-{scale}"
              for name in ("uv-variant-first.3do", "uv-variant-second.3do"):
                  digest = hashlib.sha256((folder / name).read_bytes()).hexdigest()
                  assert digest == expected, (scale, name, digest)
                  records.append({"scale": scale, "file": name, "sha256": digest})
          Path("evidence/published-identity.json").write_text(json.dumps(records, indent=2) + "\n")
          PY

      - name: Upload native Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-studio-uv-native-linux-efbd34a
          path: evidence/
          if-no-files-found: error
          retention-days: 30
