name: Qualify upstream compiled RED macOS preview
on: workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  QT_VERSION: "6.8.3"
  PRODUCT_SHA: df0bbcfe1ce830c5fb848ab02756c7a9d74cc4e2
  BUILD_ARTIFACT_ID: "14998110331"
  BUILD_RUN_ID: "45556887923"
  BUILD_JOB_ID: "139011103426"
  BUILD_ARTIFACT_DIGEST: "sha256:64a99d831a324dec2d341342fd6652c2ea8d370b3749be706a834c8656ab41e3"
jobs:
  macos:
    name: Qualify existing arm64 build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false
      - name: Verify product source and compiled artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUILD_ARTIFACT_ID" > "$RUNNER_TEMP/compiled-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$BUILD_JOB_ID" > "$RUNNER_TEMP/compiled-job.json"
          jq -e --arg sha "$PRODUCT_SHA" --argjson run "$BUILD_RUN_ID" --arg digest "$BUILD_ARTIFACT_DIGEST" '(.name == "macos-compiled-build") and (.expired == false) and (.digest == $digest) and (.workflow_run.head_sha == $sha) and (.workflow_run.id == $run)' "$RUNNER_TEMP/compiled-artifact.json"
          jq -e --arg sha "$PRODUCT_SHA" --argjson run "$BUILD_RUN_ID" '(.head_sha == $sha) and (.run_id == $run) and (.conclusion == "success") and (.name == "Build macOS arm64")' "$RUNNER_TEMP/compiled-job.json"
      - name: Install Qt and redistribution notices
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          documentation: true
          doc-archives: qtcore qtgui qtnetwork qtsvg
          doc-modules: qtmultimedia
          source: true
          src-archives: qt5
          aqtversion: ==3.3.0
          py7zrversion: ==1.1.0
      - name: Verify and restore the exact compiled product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/compiled-artifact.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BUILD_ARTIFACT_ID/zip" > "$archive"
          echo "${BUILD_ARTIFACT_DIGEST#sha256:}  $archive" | shasum -a 256 -c -
          unzip -q "$archive" macos-build.tar.gz -d "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/macos-build.tar.gz"
          grep -Fqx "#define RED_CONFIGURED_REVISION \"$PRODUCT_SHA\"" build/src/app/app_version.hpp
          file build/src/app/red-editor | grep 'arm64'

      - name: Package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)
          name="RED-${version}-macos-arm64"
          echo "PACKAGE_NAME=${name}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          app="${PWD}/${name}/RED.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp build/src/app/red-editor "${app}/Contents/MacOS/"
          cp -R build/src/app/data "${app}/Contents/Resources/data"
          ln -s ../Resources/data "${app}/Contents/MacOS/data"
          # Keep Python scripts in the app's sealed resource area. Scripts
          # inside MacOS receive attribute-based signatures that a ZIP loses.
          mkdir -p "${app}/Contents/Resources/tools/engine-capture"
          ln -s ../Resources/tools "${app}/Contents/MacOS/tools"
          cp tools/engine-capture/invoke_engine_capture.py tools/engine-capture/gameplay_capture.py tools/engine-capture/route_performance.py tools/engine-capture/route_performance_html.py tools/engine-capture/collect_route_profile.py tools/engine-capture/peer_qualification.py \
             tools/engine-capture/compare_cog_trace.py tools/engine-capture/collision_overlay.py tools/engine-capture/compare_episode_releases.py \
             tools/engine-capture/verify_episode_pair.py tools/engine-capture/triage_legacy_archives.py tools/engine-capture/README.md "${app}/Contents/Resources/tools/engine-capture/"
          cp src/app/resources/red_app.icns "${app}/Contents/Resources/red_app.icns"
          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>red-editor</string>
            <key>CFBundleIdentifier</key><string>com.codalilitari.red</string>
            <key>CFBundleName</key><string>RED</string>
            <key>CFBundleDisplayName</key><string>RED</string>
            <key>CFBundleIconFile</key><string>red_app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>13.3</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          "${QT_ROOT_DIR}/bin/macdeployqt" "${app}" -always-overwrite
          # Ad-hoc signature so Apple Silicon will run it; this is not a Developer ID signature.
          if ! codesign --force --deep --sign - "${app}"; then
            echo "Deep signing failed; signing each Mach-O file and framework instead."
            find "${app}/Contents" -type f -print0 | while IFS= read -r -d '' file; do
              if file -b "${file}" | grep -q '^Mach-O'; then codesign --force --sign - "${file}"; fi
            done
            find "${app}/Contents/Frameworks" -maxdepth 1 -name '*.framework' -exec codesign --force --sign - {} \;
            codesign --force --sign - "${app}"
          fi
          codesign --verify --deep --strict --verbose=2 "${app}"
          cp "$(find build/tools/sed-agent -maxdepth 2 -type f -name red-agent | head -n1)" "${name}/"
          cp "$(find build/tools/sed-mcp -maxdepth 2 -type f -name red-mcp | head -n1)" "${name}/"
          codesign --force --sign - "${name}/red-agent"
          codesign --force --sign - "${name}/red-mcp"
          codesign --verify --strict --verbose=2 "${name}/red-agent"
          codesign --verify --strict --verbose=2 "${name}/red-mcp"
          cp LICENSE THIRD_PARTY_NOTICES.md "${name}/"
          python3 tools/release/stage_notices.py stage --package "${name}" \
            --qt-kit "${QT_ROOT_DIR}" --qt-version "${QT_VERSION}"
          printf '%s\n' "RED ${version} for macOS on Apple silicon (preview build from GitHub Actions)." '' \
            'Move RED.app with Finder to Applications or another chosen location. Settings (red.ini) are saved' \
            'in the per-user application configuration directory; the signed app bundle is not modified.' '' \
            'The app is ad-hoc signed, not notarized, so macOS blocks the first launch. Either run' \
            '  xattr -dr com.apple.quarantine RED.app' \
            'in Terminal from the folder that holds it, or try to open it once and then choose Open Anyway' \
            'in System Settings > Privacy & Security (macOS 15 no longer offers Open on right-click).' '' \
            'Requires macOS 13.3 or newer. The bundled Qt '"${QT_VERSION}"' frameworks are covered by the LGPL v3;' \
            'their source is available from https://download.qt.io/archive/qt/. See THIRD_PARTY_NOTICES.md and' \
            'licenses/qt for the selected SDK license texts, module attributions, and SBOMs.' \
            > "${name}/README-macos.txt"
          python3 tools/release/stage_notices.py manifest --package "${name}" --version "${version}" \
            --qt-version "${QT_VERSION}" --platform macos-arm64 --commit "${PRODUCT_SHA}"
          # Inventory all payloads explicitly; do not append undeclared AppleDouble metadata.
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "${name}" "${name}.zip"

      - name: Accept extracted package CLI and signatures
        run: |
          set -euo pipefail
          archive="${PACKAGE_NAME}.zip"
          digest=$(python3 -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "$archive")
          python3 -B tools/release/accept_package_cli.py "$archive" --archive-sha256 "$digest" \
            --version "$PACKAGE_VERSION" --platform macos-arm64 --commit "$PRODUCT_SHA" \
            --receipt "$RUNNER_TEMP/macos-package-cli.json" --scratch-root "$RUNNER_TEMP" --timeout-seconds 600

      - name: Verify Finder-extracted engine runner and editor data paths
        run: |
          set -euo pipefail
          unpack="$RUNNER_TEMP/red-finder-unpack"
          mkdir "$unpack"
          ditto -x -k "${PACKAGE_NAME}.zip" "$unpack"
          cd "$unpack/$PACKAGE_NAME/RED.app/Contents"
          test -L MacOS/tools
          test -L MacOS/data
          test MacOS/tools/engine-capture/invoke_engine_capture.py -ef Resources/tools/engine-capture/invoke_engine_capture.py
          test MacOS/data/df2jk.lst -ef Resources/data/df2jk.lst
          test ! -L Resources/tools/engine-capture/invoke_engine_capture.py
          python3 -B MacOS/tools/engine-capture/invoke_engine_capture.py --help > "$RUNNER_TEMP/finder-capture-help.txt"
          shasum -a 256 MacOS/tools/engine-capture/invoke_engine_capture.py Resources/tools/engine-capture/invoke_engine_capture.py MacOS/data/df2jk.lst Resources/data/df2jk.lst

      - name: Accept extracted native installation
        run: |
          set -euo pipefail
          archive="${PACKAGE_NAME}.zip"
          digest=$(python3 -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1], "rb"), "sha256").hexdigest())' "$archive")
          mkdir -p "$RUNNER_TEMP/macos-native-acceptance"
          python3 -B tools/release/accept_package_native.py "$archive" --archive-sha256 "$digest" \
            --version "$PACKAGE_VERSION" --platform macos-arm64 --commit "$PRODUCT_SHA" \
            --receipt "$RUNNER_TEMP/macos-package-native.json" \
            --scratch-root "$RUNNER_TEMP/macos-native-acceptance" --timeout-seconds 600

      - name: Upload original build provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-macos-build-provenance
          path: |
            ${{ runner.temp }}/compiled-artifact.json
            ${{ runner.temp }}/compiled-job.json
            build/src/app/app_version.hpp
          if-no-files-found: error

      - name: Upload native installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-native-installation-evidence
          path: |
            ${{ runner.temp }}/macos-package-native.json
            ${{ runner.temp }}/macos-native-acceptance/**/commands/native-report-*/installation-report.json
            ${{ runner.temp }}/macos-native-acceptance/**/commands/native-report-*/frame-*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload package acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-package-cli-receipt
          path: ${{ runner.temp }}/macos-package-cli.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error
          retention-days: 30
