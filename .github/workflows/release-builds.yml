name: macOS parameter dialog probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  metrics:
    name: Read native parameter dialog geometry
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase
          aqtversion: ==3.3.0
          py7zrversion: ==1.1.0
      - name: Measure Cocoa menu sizing
        run: |
          cmake -S tools/release/parameter-anchor-probe -B "$RUNNER_TEMP/probe" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$RUNNER_TEMP/probe" --parallel 2
          "$RUNNER_TEMP/probe/menu-probe"
