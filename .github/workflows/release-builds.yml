name: Trace reviewed material history on native Cocoa
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          aqtversion: ==3.3.0
          py7zrversion: ==1.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-compiled-build
          github-token: ${{ github.token }}
          run-id: 45556887923
          path: ${{ runner.temp }}
      - name: Trace original Cocoa binary and a reactivated editor
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/macos-build.tar.gz"
          grep -F df0bbcfe1ce830c5fb848ab02756c7a9d74cc4e2 build/src/app/app_version.hpp
          lib="$RUNNER_TEMP/materialFocus.dylib"
          base="$QT_ROOT_DIR/lib"
          clang++ -g -std=c++17 -dynamiclib -F"$base" -I"$base/QtWidgets.framework/Headers" -I"$base/QtGui.framework/Headers" -I"$base/QtCore.framework/Headers" tools/release/material-history-probe/focus.cpp -framework QtWidgets -framework QtGui -framework QtCore -o "$lib"
          xcrun swift tools/release/prepare_macos_test_display.swift
          nm -C build/src/app/sed_app_main_window_tests > "$RUNNER_TEMP/material-nm"
          grep -E 'triggerDocumentAction|triggerActiveCogScriptEditorUndoRedo' "$RUNNER_TEMP/material-nm" | head -12 || true
          for mode in original active; do
            vars="DYLD_INSERT_LIBRARIES=$lib QT_QPA_PLATFORM=cocoa"; if [ "$mode" = active ]; then vars="$vars MATERIAL_ACTIVATE_VIEW=1"; fi
            echo "MATERIAL mode=$mode"
            xcrun lldb --batch -o "settings set target.env-vars $vars" -o "command script import $PWD/tools/release/material-history-probe/debug.py" -o "trace-material" -o run -- build/src/app/sed_app_main_window_tests --reviewed-material-edit
          done
