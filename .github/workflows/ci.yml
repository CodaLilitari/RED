name: Hosted Windows display inventory (diagnostic only)

on:
  push:
    branches: [diagnostic/hosted-display-inventory]

permissions:
  contents: read

jobs:
  display-inventory:
    name: Read advertised and raw adapter modes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Query modes without changing display settings
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP "red-windows-display-probe.exe"
          $object = Join-Path $env:RUNNER_TEMP "red-windows-display-probe.obj"
          cl.exe /nologo /EHsc /W4 /WX tools/ci/windows_display_probe.cpp user32.lib "/Fo:$object" "/Fe:$helper"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $helper
          exit $LASTEXITCODE
